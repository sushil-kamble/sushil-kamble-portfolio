<!doctype html>
<html lang="en" class="h-full">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!-- Google tag (gtag.js) -->
		<script async src="https://www.googletagmanager.com/gtag/js?id=G-PPYX0G25TH"></script>
		<script>
			window.dataLayer = window.dataLayer || [];
			function gtag() {
				dataLayer.push(arguments);
			}
			gtag('js', new Date());
			gtag('config', 'G-PPYX0G25TH');
		</script>

		<!-- SEO essentials -->
		<meta
			name="description"
			content="Sushil Kamble — Full-stack developer portfolio styled as a VS Code editor. Explore projects, blog posts, skills, and career journey."
		/>
		<meta name="author" content="Sushil Kamble" />
		<meta name="robots" content="index, follow" />
		<link rel="canonical" href="https://sushilkamble.com" />

		<!-- Favicon -->
		<link rel="icon" href="/favicon.ico" sizes="48x48" />
		<link rel="icon" href="/favicon.ico" type="image/x-icon" />
		<meta name="theme-color" content="#1e1e1e" />

		<!-- Open Graph / Facebook -->
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://sushilkamble.com" />
		<meta property="og:title" content="Sushil Kamble" />
		<meta
			property="og:description"
			content="Full-stack developer portfolio built as an interactive VS Code editor. Browse projects, blog posts, and career journey."
		/>
		<meta property="og:site_name" content="Sushil Kamble" />
		<meta property="og:locale" content="en_US" />

		<!-- Twitter Card -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Sushil Kamble" />
		<meta
			name="twitter:description"
			content="Full-stack developer portfolio built as an interactive VS Code editor. Browse projects, blog posts, and career journey."
		/>

		<!-- Additional SEO -->
		<meta
			name="keywords"
			content="Sushil Kamble, full-stack developer, software engineer, portfolio, web developer, React, Svelte, Node.js, TypeScript, JavaScript"
		/>
		<meta name="generator" content="SvelteKit" />

		<script>
			// Prevent flash of default theme on load
			(function () {
				try {
					var isAdminRoute = window.location.pathname.startsWith('/admin');
					document.documentElement.setAttribute(
						'data-route-kind',
						isAdminRoute ? 'admin' : 'portfolio'
					);
					var t = localStorage.getItem('portfolio-theme');
					var f = localStorage.getItem('portfolio-font');
					if (t && t !== 'dark-default') document.documentElement.setAttribute('data-theme', t);
					if (f && f !== 'jetbrains-mono') document.documentElement.setAttribute('data-font', f);
				} catch (e) {}
			})();
			// Stamp splash birth — used to guarantee minimum display time
			window.__splashBorn = Date.now();
		</script>
		<style>
			/* ── Splash Screen ── */
			#splash {
				position: fixed;
				inset: 0;
				z-index: 9999;
				display: flex;
				align-items: center;
				justify-content: center;
				background: #1e1e1e;
			}
			/* Phase 1: completion — progress goes green, cursor vanishes */
			#splash.splash-complete .splash-progress-bar {
				background: linear-gradient(90deg, #28c840, #1fa834) !important;
				box-shadow: 0 0 16px rgba(40, 200, 64, 0.5);
			}
			#splash.splash-complete .splash-cursor {
				animation: none;
				opacity: 0;
			}
			/* Phase 2: exit — zoom forward + blur + dissolve */
			#splash.splash-exit {
				opacity: 0;
				transform: scale(1.06);
				filter: blur(12px);
				pointer-events: none;
				transition:
					opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1),
					transform 0.8s cubic-bezier(0.4, 0, 0.2, 1),
					filter 0.8s cubic-bezier(0.4, 0, 0.2, 1);
			}
			.splash-card {
				width: 360px;
				max-width: 90vw;
				border: 1px solid #333;
				border-radius: 10px;
				background: #252526;
				overflow: hidden;
				box-shadow:
					0 24px 80px rgba(0, 0, 0, 0.5),
					0 0 0 1px rgba(255, 255, 255, 0.03);
			}
			/* Title bar */
			.splash-titlebar {
				display: flex;
				align-items: center;
				height: 38px;
				padding: 0 14px;
				border-bottom: 1px solid #333;
				background: #161616;
			}
			.splash-dots {
				display: flex;
				gap: 7px;
			}
			.splash-dot {
				width: 11px;
				height: 11px;
				border-radius: 50%;
				opacity: 0;
				animation: splashDotPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
			}
			.splash-dot:nth-child(1) {
				background: #ff5f57;
				animation-delay: 0.15s;
			}
			.splash-dot:nth-child(2) {
				background: #febc2e;
				animation-delay: 0.3s;
			}
			.splash-dot:nth-child(3) {
				background: #28c840;
				animation-delay: 0.45s;
			}
			.splash-title {
				flex: 1;
				text-align: center;
				font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
				font-size: 12px;
				color: #808080;
				opacity: 0;
				animation: splashFadeIn 0.5s ease forwards 0.5s;
			}
			.splash-spacer {
				width: 54px;
			}
			/* Terminal body */
			.splash-body {
				padding: 20px 18px 18px;
			}
			.splash-line {
				font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
				font-size: 13px;
				line-height: 1.8;
				white-space: nowrap;
				overflow: hidden;
				opacity: 0;
			}
			/* Staggered typing — spread across the full 4s duration */
			.splash-line:nth-child(1) {
				animation: splashTypeLine 0.5s steps(28) forwards 0.6s;
				color: #808080;
			}
			.splash-line:nth-child(2) {
				animation: splashTypeLine 0.5s steps(24) forwards 1.4s;
				color: #808080;
			}
			.splash-line:nth-child(3) {
				animation: splashTypeLine 0.5s steps(22) forwards 2.2s;
				color: #6a9955;
			}
			.splash-prompt {
				color: #569cd6;
			}
			.splash-accent {
				color: #dcdcaa;
			}
			/* Cursor */
			.splash-cursor {
				display: inline-block;
				width: 8px;
				height: 15px;
				background: #569cd6;
				margin-left: 2px;
				vertical-align: text-bottom;
				animation: splashCursorBlink 0.8s step-end infinite;
				transition: opacity 0.3s ease;
			}
			/* Progress bar */
			.splash-progress-track {
				margin-top: 16px;
				height: 2px;
				background: #333;
				border-radius: 1px;
				overflow: hidden;
			}
			.splash-progress-bar {
				height: 100%;
				width: 0;
				background: linear-gradient(90deg, #569cd6, #1b6acd);
				border-radius: 1px;
				/* Fill spans the entire splash duration */
				animation: splashProgressFill 3.6s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards 0.4s;
				transition:
					background 0.4s ease,
					box-shadow 0.4s ease;
			}
			/* Branding */
			.splash-brand {
				margin-top: 24px;
				text-align: center;
				font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
				font-size: 11px;
				color: #4a4a4a;
				letter-spacing: 0.5px;
				opacity: 0;
				animation: splashFadeIn 0.6s ease forwards 1s;
			}

			/* ── App content: starts hidden, revealed with deblur ── */
			#app-content {
				height: 100%;
				opacity: 0;
				filter: blur(12px);
				transform: scale(0.98);
			}
			#app-content.revealed {
				opacity: 1;
				filter: blur(0px);
				transform: scale(1);
				transition:
					opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1),
					filter 1s cubic-bezier(0.16, 1, 0.3, 1),
					transform 0.9s cubic-bezier(0.16, 1, 0.3, 1);
			}
			html[data-route-kind='admin'] #splash {
				display: none;
			}
			html[data-route-kind='admin'] #app-content {
				opacity: 1;
				filter: none;
				transform: none;
			}

			/* ── Keyframes ── */
			@keyframes splashDotPop {
				from {
					opacity: 0;
					transform: scale(0);
				}
				to {
					opacity: 1;
					transform: scale(1);
				}
			}
			@keyframes splashFadeIn {
				from {
					opacity: 0;
				}
				to {
					opacity: 1;
				}
			}
			@keyframes splashTypeLine {
				from {
					opacity: 1;
					max-width: 0;
				}
				to {
					opacity: 1;
					max-width: 100%;
				}
			}
			@keyframes splashCursorBlink {
				50% {
					opacity: 0;
				}
			}
			@keyframes splashProgressFill {
				to {
					width: 100%;
				}
			}
			/* Respect prefers-reduced-motion */
			@media (prefers-reduced-motion: reduce) {
				#splash,
				#splash.splash-exit,
				.splash-dot,
				.splash-title,
				.splash-line,
				.splash-progress-bar,
				.splash-brand,
				.splash-cursor,
				#app-content,
				#app-content.revealed {
					animation-duration: 0.01s !important;
					animation-delay: 0s !important;
					transition-duration: 0.01s !important;
				}
				#app-content {
					opacity: 1;
					filter: none;
					transform: none;
				}
			}
		</style>
		%sveltekit.head%
	</head>
	<body class="h-full" data-sveltekit-preload-data="hover">
		<!-- Splash screen — dismissed by SvelteKit after guaranteed minimum duration -->
		<div id="splash" aria-hidden="true">
			<div>
				<div class="splash-card">
					<div class="splash-titlebar">
						<div class="splash-dots">
							<div class="splash-dot"></div>
							<div class="splash-dot"></div>
							<div class="splash-dot"></div>
						</div>
						<div class="splash-title">sushilkamble.com — VS Code</div>
						<div class="splash-spacer"></div>
					</div>
					<div class="splash-body">
						<div class="splash-line">
							<span class="splash-prompt">&gt;</span> Initializing workspace...
						</div>
						<div class="splash-line">
							<span class="splash-prompt">&gt;</span> Loading
							<span class="splash-accent">extensions</span>...
						</div>
						<div class="splash-line">
							<span class="splash-prompt">&gt;</span> sushilkamble.com —
							<span style="color: #6a9955">ready</span>
							<span class="splash-cursor"></span>
						</div>
						<div class="splash-progress-track">
							<div class="splash-progress-bar"></div>
						</div>
					</div>
				</div>
				<div class="splash-brand">crafted with precision</div>
			</div>
		</div>

		<div id="app-content">%sveltekit.body%</div>
	</body>
</html>
