<!doctype html>
<html lang="en" class="h-full">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			// Prevent flash of default theme on load
			(function () {
				try {
					var t = localStorage.getItem('portfolio-theme');
					var f = localStorage.getItem('portfolio-font');
					if (t && t !== 'dark-default') document.documentElement.setAttribute('data-theme', t);
					if (f && f !== 'jetbrains-mono') document.documentElement.setAttribute('data-font', f);
				} catch (e) {}
			})();
		</script>
		<style>
			/* ── Splash Screen ── */
			#splash {
				position: fixed;
				inset: 0;
				z-index: 9999;
				display: flex;
				align-items: center;
				justify-content: center;
				background: #1e1e1e;
			}
			/* Exit: zoom through + blur + fade */
			#splash.splash-exit {
				opacity: 0;
				transform: scale(1.04);
				filter: blur(8px);
				pointer-events: none;
				transition:
					opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1),
					transform 0.6s cubic-bezier(0.4, 0, 0.2, 1),
					filter 0.6s cubic-bezier(0.4, 0, 0.2, 1);
			}
			.splash-card {
				width: 360px;
				max-width: 90vw;
				border: 1px solid #333;
				border-radius: 10px;
				background: #252526;
				overflow: hidden;
				box-shadow:
					0 24px 80px rgba(0, 0, 0, 0.5),
					0 0 0 1px rgba(255, 255, 255, 0.03);
			}
			/* Title bar */
			.splash-titlebar {
				display: flex;
				align-items: center;
				height: 38px;
				padding: 0 14px;
				border-bottom: 1px solid #333;
				background: #161616;
			}
			.splash-dots {
				display: flex;
				gap: 7px;
			}
			.splash-dot {
				width: 11px;
				height: 11px;
				border-radius: 50%;
				opacity: 0;
				animation: dotPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
			}
			.splash-dot:nth-child(1) {
				background: #ff5f57;
				animation-delay: 0.1s;
			}
			.splash-dot:nth-child(2) {
				background: #febc2e;
				animation-delay: 0.2s;
			}
			.splash-dot:nth-child(3) {
				background: #28c840;
				animation-delay: 0.3s;
			}
			.splash-title {
				flex: 1;
				text-align: center;
				font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
				font-size: 12px;
				color: #808080;
				opacity: 0;
				animation: fadeIn 0.4s ease forwards 0.35s;
			}
			.splash-spacer {
				width: 54px;
			}
			/* Terminal body */
			.splash-body {
				padding: 20px 18px 18px;
			}
			.splash-line {
				font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
				font-size: 13px;
				line-height: 1.8;
				white-space: nowrap;
				overflow: hidden;
				opacity: 0;
			}
			.splash-line:nth-child(1) {
				animation: typeLine 0.4s steps(28) forwards 0.4s;
				color: #808080;
			}
			.splash-line:nth-child(2) {
				animation: typeLine 0.4s steps(24) forwards 0.75s;
				color: #808080;
			}
			.splash-line:nth-child(3) {
				animation: typeLine 0.4s steps(22) forwards 1.1s;
				color: #6a9955;
			}
			.splash-prompt {
				color: #569cd6;
			}
			.splash-accent {
				color: #dcdcaa;
			}
			/* Cursor */
			.splash-cursor {
				display: inline-block;
				width: 8px;
				height: 15px;
				background: #569cd6;
				margin-left: 2px;
				vertical-align: text-bottom;
				animation: cursorBlink 0.8s step-end infinite;
			}
			/* Progress bar */
			.splash-progress-track {
				margin-top: 16px;
				height: 2px;
				background: #333;
				border-radius: 1px;
				overflow: hidden;
			}
			.splash-progress-bar {
				height: 100%;
				width: 0;
				background: linear-gradient(90deg, #569cd6, #1b6acd);
				border-radius: 1px;
				/* Slow fill — spans the full splash duration */
				animation: progressFill 2.2s cubic-bezier(0.4, 0, 0.2, 1) forwards 0.4s;
				transition:
					background 0.4s ease,
					box-shadow 0.4s ease;
			}
			/* Completion state: progress turns green with glow */
			#splash.splash-complete .splash-progress-bar {
				background: linear-gradient(90deg, #28c840, #1fa834);
				box-shadow: 0 0 12px rgba(40, 200, 64, 0.4);
			}
			#splash.splash-complete .splash-cursor {
				animation: none;
				opacity: 0;
				transition: opacity 0.3s ease;
			}
			/* Branding */
			.splash-brand {
				margin-top: 24px;
				text-align: center;
				font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
				font-size: 11px;
				color: #4a4a4a;
				letter-spacing: 0.5px;
				opacity: 0;
				animation: fadeIn 0.5s ease forwards 0.6s;
			}

			/* ── App content reveal ── */
			#app-content {
				height: 100%;
				opacity: 0;
				transform: scale(0.98) translateY(4px);
				filter: blur(4px);
			}
			#app-content.revealed {
				opacity: 1;
				transform: scale(1) translateY(0);
				filter: blur(0);
				transition:
					opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1),
					transform 0.7s cubic-bezier(0.16, 1, 0.3, 1),
					filter 0.7s cubic-bezier(0.16, 1, 0.3, 1);
			}

			/* Keyframes */
			@keyframes dotPop {
				from {
					opacity: 0;
					transform: scale(0);
				}
				to {
					opacity: 1;
					transform: scale(1);
				}
			}
			@keyframes fadeIn {
				from {
					opacity: 0;
				}
				to {
					opacity: 1;
				}
			}
			@keyframes typeLine {
				from {
					opacity: 1;
					max-width: 0;
				}
				to {
					opacity: 1;
					max-width: 100%;
				}
			}
			@keyframes cursorBlink {
				50% {
					opacity: 0;
				}
			}
			@keyframes progressFill {
				to {
					width: 100%;
				}
			}
			/* Respect prefers-reduced-motion */
			@media (prefers-reduced-motion: reduce) {
				#splash,
				.splash-dot,
				.splash-title,
				.splash-line,
				.splash-progress-bar,
				.splash-brand,
				.splash-cursor,
				#app-content,
				#app-content.revealed {
					animation-duration: 0.01s !important;
					animation-delay: 0s !important;
					transition-duration: 0.01s !important;
				}
				#app-content {
					opacity: 1;
					transform: none;
					filter: none;
				}
			}
		</style>
		%sveltekit.head%
	</head>
	<body class="h-full" data-sveltekit-preload-data="hover">
		<!-- Splash screen — removed after SvelteKit hydrates -->
		<div id="splash" aria-hidden="true">
			<div>
				<div class="splash-card">
					<div class="splash-titlebar">
						<div class="splash-dots">
							<div class="splash-dot"></div>
							<div class="splash-dot"></div>
							<div class="splash-dot"></div>
						</div>
						<div class="splash-title">sushil.dev — VS Code</div>
						<div class="splash-spacer"></div>
					</div>
					<div class="splash-body">
						<div class="splash-line">
							<span class="splash-prompt">&gt;</span> Initializing workspace...
						</div>
						<div class="splash-line">
							<span class="splash-prompt">&gt;</span> Loading
							<span class="splash-accent">extensions</span>...
						</div>
						<div class="splash-line">
							<span class="splash-prompt">&gt;</span> sushil.dev —
							<span style="color: #6a9955">ready</span>
							<span class="splash-cursor"></span>
						</div>
						<div class="splash-progress-track">
							<div class="splash-progress-bar"></div>
						</div>
					</div>
				</div>
				<div class="splash-brand">crafted with precision</div>
			</div>
		</div>

		<div id="app-content">%sveltekit.body%</div>
	</body>
</html>
